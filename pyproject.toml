[project]
name = "wmusicbase"
version = "0.1.0"
description = "personal music base"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=23,<26",
    "alembic>=1.12,<2.0",
    "asyncache>=0.3,<0.4",
    "asyncpg>=0.29,<1.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "itsdangerous>=2.1,<3.0",
    "mutagen>=1.47,<2.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "pillow>=10,<13",
    "psutil>=7.0,<7.2",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "pyacoustid>=1.3,<2.0",
    "pypinyin>=0.55,<1.0",
    "python-dotenv>=1.0,<2.0",
    "python-jose>=3.3,<4.0",
    "python-multipart>=0.0.5,<1.0",
    "requests>=2.31,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    "watchdog>=5.0,<7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=1.0,<2.0"
]